<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tự luận Tiếng Anh 50 câu</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'media'}</script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}html{scroll-padding-top:130px;scroll-behavior:smooth}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 pb-28 font-sans">

<header class="sticky z-20 bg-white/95 dark:bg-slate-800/95 border-b border-slate-200 dark:border-slate-700 backdrop-blur" style="top:env(safe-area-inset-top,0px)">
  <div class="max-w-5xl mx-auto px-4 py-2">
    <div class="flex items-center justify-between gap-3">
      <h1 class="font-bold text-base sm:text-lg">📝 Tự luận Tiếng Anh <span id="who" class="font-normal text-sm text-slate-500 dark:text-slate-400"></span></h1>
      <div class="text-sm flex gap-3">
        <span>Đã làm: <b id="cnt">0</b>/50</span>
        <span>⏱ <b id="time">60:00</b></span>
      </div>
    </div>
    <div class="mt-2 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden" title="Thời gian đã dùng">
      <div id="tbar" class="h-full bg-indigo-500 transition-all duration-1000" style="width:0%"></div>
    </div>
    <div class="mt-1 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden" title="Tiến độ làm bài">
      <div id="pbar" class="h-full bg-emerald-500 transition-all" style="width:0%"></div>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-4">
  <div id="result" class="hidden mb-4 rounded-2xl p-5 bg-indigo-600 text-white"></div>
  <div class="lg:grid lg:grid-cols-[1fr_15rem] lg:gap-6">
    <aside id="nav" class="hidden lg:block lg:order-2 mb-4">
      <div class="lg:sticky rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3" style="top:110px">
        <div class="text-sm font-semibold mb-2">Danh sách câu hỏi</div>
        <div id="grid" class="grid grid-cols-8 sm:grid-cols-10 lg:grid-cols-5 gap-1.5"></div>
        <div class="mt-3 text-xs space-y-1 text-slate-500 dark:text-slate-400" id="legend"></div>
      </div>
    </aside>
    <section id="qs" class="lg:order-1 space-y-4"></section>
  </div>
</main>

<div class="fixed inset-x-0 bottom-0 z-30 bg-white/95 dark:bg-slate-800/95 border-t border-slate-200 dark:border-slate-700 backdrop-blur" style="padding-bottom:env(safe-area-inset-bottom,0px)">
  <div class="max-w-5xl mx-auto px-4 py-3 flex gap-2">
    <button id="tog" class="lg:hidden px-3 py-3 rounded-xl border border-slate-300 dark:border-slate-600 font-semibold">☰ 1–50</button>
    <button id="reset" class="px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 font-semibold">↺ Làm lại</button>
    <button id="submit" class="flex-1 px-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow">Nộp bài</button>
  </div>
</div>

<div id="modal" class="hidden fixed inset-0 z-40 bg-black/50 items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 max-w-sm w-full">
    <p id="mtext" class="mb-4"></p>
    <div class="flex gap-2 justify-end">
      <button id="mno" class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600">Quay lại</button>
      <button id="myes" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold">Vẫn nộp</button>
    </div>
  </div>
</div>

<div id="intro" class="fixed inset-0 z-50 bg-slate-50 dark:bg-slate-900 flex items-center justify-center p-4 overflow-auto">

    <div class="text-5xl">📝</div>
    <h1 class="mt-2 text-2xl font-extrabold">Bài tự luận Tiếng Anh</h1>

    <p id="nerr" class="hidden mt-1 text-sm text-red-600 dark:text-red-400">Vui lòng nhập tên trước khi bắt đầu.</p>
    <button id="go" class="mt-4 w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold">Bắt đầu làm bài</button>
  </div>
</div>
<div id="cg" class="hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4">

    <button id="cgok" class="mt-5 w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold">Xem kết quả &amp; đáp án</button>
  </div>
</div>

["Tom broke the window.","The window","was broken by Tom","bị động","Quá khứ đơn bị động: was + V3 (broken)."],
["They built this bridge in 1990.","This bridge","was built in 1990","bị động","Quá khứ đơn bị động: was built; “by them” có thể bỏ."],
["They will have finished the report by the time you arrive.","The report","will have been finished by the time you arrive","bị động","Tương lai hoàn thành bị động: will have been + V3."],
["We haven’t sent the letters yet.","The letters","haven’t been sent yet","bị động","Hiện tại hoàn thành bị động: have/has + been + V3. “Letters” số nhiều → haven’t been sent."],
["This song was written by my brother.","My brother","wrote this song","chủ động","Bị động → chủ động: “by my brother” thành chủ ngữ, was written → wrote (quá khứ đơn)."],
["Someone is cleaning the room at the moment.","The room","is being cleaned at the moment","bị động","Hiện tại tiếp diễn bị động: am/is/are + being + V3."],
["The storm destroyed many houses last week.","Many houses","were destroyed by the storm last week","bị động","Quá khứ đơn bị động, “houses” số nhiều → were destroyed."],
["A beautiful dress was bought by her for the party.","She","bought a beautiful dress for the party","chủ động","Bị động → chủ động: “by her” thành chủ ngữ She, was bought → bought."],
["We must finish the homework before Friday.","The homework","must be finished before Friday","bị động","Bị động với modal: modal + be + V3 → must be finished."],
["Someone was cooking dinner when I got home.","Dinner","was being cooked when I got home","bị động","Quá khứ tiếp diễn bị động: was/were being + V3."],
["The students were asked by the teacher to read the text.","The teacher","asked the students to read the text","chủ động","Bị động → chủ động: were asked → asked (quá khứ đơn), giữ nguyên “to read the text”."],
["His boss criticized him for being late.","He","was criticized by his boss for being late","bị động","Quá khứ đơn bị động: tân ngữ “him” → chủ ngữ “He”, was criticized."],
["Pho is loved by many people now.","Many people","love pho now","chủ động","Bị động → chủ động: “many people” số nhiều → love (hiện tại đơn, không thêm s)."],
["The manager has to sign the documents.","The documents","have to be signed by the manager","bị động","Bị động với have to: have/has to + be + V3. “Documents” số nhiều → have to be signed."],
["The door hasn’t been opened by anybody yet.","Nobody","has opened the door yet","chủ động","Bị động phủ định → chủ động với Nobody (đã mang nghĩa phủ định): has opened."],
["The mayor will open the new museum next month.","The new museum","will be opened by the mayor next month","bị động","Tương lai đơn bị động: will + be + V3."],
["This photo was taken by me when I was ten.","I","took this photo when I was ten","chủ động","Bị động → chủ động: “by me” thành chủ ngữ I, was taken → took."],
["They are taking the patient to the hospital right now.","The patient","is being taken to the hospital right now","bị động","Hiện tại tiếp diễn bị động: is + being + V3."],
["A car hit the cat this morning.","The cat","was hit by a car this morning","bị động","Quá khứ đơn bị động: was + V3 (hit)."],
["The exams were taken by the students last week.","The students","took their exams last week","chủ động","Bị động → chủ động: “by the students” thành chủ ngữ, were taken → took (có thể dùng the/their exams)."]
];
const normT=s=>norm(s).replace(/[.!]+$/,"").replace(/\s+by (them|us|someone|somebody|people)\b/g,"").replace(/\b(the|their) exams\b/,"exams");
const ansOf=k=>k<25?T[k][1]+" "+T[k][2]+".":Q[k][1][Q[k][2]];
const kind=k=>k<25?(T[k][3]==="bị động"?"Chủ động → Bị động":"Bị động → Chủ động"):(ansOf(k).includes("going to")?"Tương lai gần (be going to)":"Tương lai đơn (will)");
const ok=p=>{const k=P[p];
  if(k<25){let n=normT(ans[p]);const pre=norm(T[k][1])+" ";if(n.startsWith(pre))n=n.slice(pre.length);return n!==""&&n===normT(T[k][2])}
  const n=norm(ans[p]);return n!==""&&[ansOf(k),...(ALT[k]||[])].some(a=>norm(a)===n)};
const tBody=(p,k,inp)=>`<p class="font-semibold"><span class="text-indigo-600 dark:text-indigo-300">Câu ${p+1}.</span> Viết lại câu sau sang <u>${T[k][3]}</u>:</p>
  <p class="mt-1 italic text-slate-600 dark:text-slate-300">“${T[k][0]}”</p>
  <div class="mt-2 flex items-center gap-2 flex-wrap sm:flex-nowrap"><b class="whitespace-nowrap">→ ${T[k][1]}</b>${inp}</div>`;
const has=p=>ans[p].trim()!=="";


function inCls(p){
  let c="mx-1 "+(P[p]<25?"w-full":"w-48 max-w-full")+" px-2 py-1 rounded-md border-2 font-normal bg-white dark:bg-slate-900 outline-none ";
  if(!done) return c+"border-slate-300 dark:border-slate-600 focus:border-indigo-500";
  if(!has(p)) return c+"border-amber-400";
  return c+(ok(p)?"border-emerald-500 text-emerald-700 dark:text-emerald-300":"border-red-500 text-red-700 dark:text-red-300");
}
function navCls(p){
  let c="h-9 rounded-md text-sm font-semibold border ";
  if(done){
    if(!has(p)) return c+"border-amber-400 bg-amber-100 dark:bg-amber-900 text-amber-900 dark:text-amber-100";
    return c+(ok(p)?"border-emerald-500 bg-emerald-500 text-white":"border-red-500 bg-red-500 text-white");
  }
  return c+(has(p)?"border-indigo-600 bg-indigo-600 text-white":"border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700");
}

function render(){
  $("qs").innerHTML=P.map((k,p)=>{
    const isT=k<25;const [a,b]=isT?["",""]:Q[k][0].split("___");
    const inp=`<input data-q="${p}" value="${esc(ans[p])}" ${done?"disabled":""} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập đáp án" class="${inCls(p)}">`;
    let extra;
    if(done){
      const g=has(p)?(ok(p)?"✔ Chính xác.":"✘ Chưa đúng."):"⚠ Chưa làm.";
      extra=`<div class="mt-2 text-sm rounded-lg p-3 ${ok(p)?"bg-emerald-50 dark:bg-emerald-950":"bg-amber-50 dark:bg-amber-950"}"><b>${g}</b> Đáp án đúng: <b>${ansOf(k)}</b><br>💡 ${isT?T[k][4]:Q[k][3]}</div>`;
    } else {
      extra="";
    }
    return `<article id="q${p}" class="rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4">
      ${isT?tBody(p,k,inp):`<p class="font-semibold leading-10"><span class="text-indigo-600 dark:text-indigo-300">Câu ${p+1}.</span> ${a}${inp}<span class="font-normal text-slate-500 dark:text-slate-400">(${V[k]})</span>${b}</p>`}${extra}</article>`;
  }).join("");
  $("grid").innerHTML=P.map((_,p)=>`<button data-j="${p}" class="${navCls(p)}">${p+1}</button>`).join("");
  $("legend").innerHTML=done?"<div>🟩 Đúng &nbsp; 🟥 Sai &nbsp; 🟨 Chưa làm</div>":"<div>🟪 Đã làm &nbsp; ⬜ Chưa làm</div>";
  upd();
}
function upd(){
  const n=ans.filter(a=>a.trim()!=="").length;
  $("cnt").textContent=n; $("pbar").style.width=(n/N*100)+"%";
  document.querySelectorAll("[data-j]").forEach(b=>b.className=navCls(+b.dataset.j));
}
function tick(){
  left--; $("time").textContent=fmt(left);
  $("tbar").style.width=((TOTAL_SEC-left)/TOTAL_SEC*100)+"%";
  $("tbar").className="h-full transition-all duration-1000 "+(left<300?"bg-red-500":"bg-indigo-500");
  if(left<=0) finish();
}
function finish(){
  clearInterval(timer); done=true;
  const S={}, bad=[]; let s1=0,s2=0,skip=0;
  P.forEach((k,p)=>{
    const g=has(p)&&ok(p), t=kind(k);
    S[t]=S[t]||[0,0]; S[t][1]++;
    if(g){S[t][0]++; k<25?s1++:s2++} else bad.push(p);
    if(!has(p)) skip++;
  });
  const t=s1+s2, wrong=N-t-skip, used=TOTAL_SEC-left;
  const row=(n,a,b)=>`<div><div class="flex justify-between text-sm"><span>${n}</span><b>${a}/${b}</b></div><div class="h-2 rounded-full bg-white/25 overflow-hidden"><div class="h-full bg-white" style="width:${b?a/b*100:0}%"></div></div></div>`;
  const box=(l,v)=>`<div class="rounded-xl bg-white/15 py-2"><div class="text-2xl font-extrabold">${v}</div><div class="text-xs">${l}</div></div>`;
  const types=["Chủ động → Bị động","Bị động → Chủ động","Tương lai đơn (will)","Tương lai gần (be going to)"];
  const r=$("result"); r.classList.remove("hidden");
  r.innerHTML=`<div class="text-sm opacity-90">📊 Thống kê kết quả của <b>${esc(NAME)}</b></div>
    <div class="flex flex-wrap items-end gap-x-6 gap-y-1"><div class="text-4xl font-extrabold">${t}/50 <span class="text-xl font-semibold">(${(t/5).toFixed(1)}/10)</span></div>
    <div class="text-sm">Tỉ lệ đúng <b>${Math.round(t/N*100)}%</b> · Thời gian làm <b>${fmt(used)}</b></div></div>
    <div class="grid grid-cols-3 gap-2 mt-3 text-center">${box("✔ Đúng",t)}${box("✘ Sai",wrong)}${box("⚠ Bỏ trống",skip)}</div>
    <div class="mt-4 grid sm:grid-cols-2 gap-3">
      ${row("Phần 1: Chủ động/Bị động",s1,25)}${row("Phần 2: Tương lai",s2,25)}
      ${types.map(n=>row(n,(S[n]||[0,0])[0],(S[n]||[0,0])[1])).join("")}
    </div>
    <div class="mt-4 text-sm">${bad.length?`Câu cần xem lại (${bad.length}): <span class="inline-flex flex-wrap gap-1 align-middle">${bad.sort((a,b)=>a-b).map(p=>`<button data-j="${p}" class="px-2 py-0.5 rounded-md bg-white/20 hover:bg-white/30 font-semibold">${p+1}</button>`).join("")}</span>`:"🎯 Bạn làm đúng toàn bộ!"}</div>
    <div class="mt-2 text-sm">${t>=45?"🎉 Xuất sắc!":t>=35?"👍 Khá tốt, xem lại các câu sai nhé.":t>=25?"💪 Cần ôn thêm, đọc kỹ phần giải thích bên dưới.":"📚 Hãy ôn lại lý thuyết rồi làm lại nhé!"}</div>`;
  $("submit").disabled=true; $("submit").classList.add("opacity-50");
  render(); window.scrollTo({top:0}); congrats(t);
}
function congrats(t){
  const m=t>=45?["🏆","Kết quả xuất sắc, bạn nắm rất vững kiến thức!"]:t>=35?["🎉","Kết quả rất tốt, xem lại vài câu sai là hoàn hảo!"]:t>=25?["👏","Bạn đã hoàn thành bài! Xem phần giải thích để tiến bộ hơn nhé."]:["💪","Quan trọng là bạn đã hoàn thành. Ôn lại rồi thử lần nữa nhé!"];
  $("cgbody").innerHTML=`<div class="text-6xl">${m[0]}</div><h2 class="mt-2 text-2xl font-extrabold">Chúc mừng ${esc(NAME)}!</h2><p class="mt-2">Bạn đã hoàn thành bài tự luận 50 câu và đạt <b>${t}/50</b> (${(t/5).toFixed(1)}/10).</p><p class="mt-1 text-sm text-slate-500 dark:text-slate-400">${m[1]}</p>`;
  $("cg").classList.remove("hidden"); $("cg").classList.add("flex");
  const c=document.createElement("div"); c.className="fixed inset-0 pointer-events-none overflow-hidden"; c.style.zIndex=60;
  const E=["🎉","✨","🎊","⭐","💫"];
  for(let i=0;i<50;i++){const e=document.createElement("span");e.textContent=E[i%5];e.style.cssText=`position:absolute;top:-30px;left:${Math.random()*100}%;font-size:${16+Math.random()*16}px;animation:fall ${2.5+Math.random()*2.5}s linear ${Math.random()}s forwards`;c.appendChild(e)}
  document.body.appendChild(c); setTimeout(()=>c.remove(),6500);
}
function start(){
  P=[...Array(N).keys()];
  for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[P[i],P[j]]=[P[j],P[i]]}
  ans=Array(N).fill(""); done=false; left=TOTAL_SEC; hu=new Set();
  clearInterval(timer); timer=setInterval(tick,1000);
  $("result").classList.add("hidden");
  $("submit").disabled=false; $("submit").classList.remove("opacity-50");
  $("time").textContent=fmt(left); $("tbar").style.width="0%";
  render(); window.scrollTo({top:0});
}
function ask(text,cb){
  $("mtext").textContent=text; $("modal").classList.remove("hidden"); $("modal").classList.add("flex");
  const close=()=>{$("modal").classList.add("hidden");$("modal").classList.remove("flex")};
  $("myes").onclick=()=>{close();cb()}; $("mno").onclick=close;
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.q!==undefined&&!done){ans[+t.dataset.q]=t.value;upd()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.q!==undefined){
    e.preventDefault();
    const n=document.querySelector(`input[data-q="${+e.target.dataset.q+1}"]`);
    if(n){n.focus();n.scrollIntoView({block:"center"})}
  }
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.h!==undefined){
    const p=+b.dataset.h; hu.add(p);
    $("h"+p).classList.toggle("hidden");
  } else if(b.dataset.j!==undefined){
    $("q"+b.dataset.j).scrollIntoView({behavior:"smooth",block:"center"});
  }
});
$("submit").onclick=()=>{
  const k=ans.filter(a=>a.trim()==="").length;
  k?ask(`Bạn còn ${k} câu chưa làm. Vẫn muốn nộp bài?`,finish):finish();
};
$("reset").onclick=()=>ask("Xóa toàn bộ bài làm, xáo trộn lại câu hỏi và bắt đầu lại?",start);
$("tog").onclick=()=>$("nav").classList.toggle("hidden");
$("cgok").onclick=()=>{$("cg").classList.add("hidden");$("cg").classList.remove("flex");window.scrollTo({top:0})};
const go=()=>{const v=$("nm").value.trim();if(!v){$("nerr").classList.remove("hidden");$("nm").focus();return}NAME=v;$("who").textContent="· "+v;$("intro").classList.add("hidden");start()};
$("go").onclick=go;
$("nm").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
$("nm").focus();
</script>
</body>
</html>
